<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="35%" stop-color="#DFC078" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7432" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC078" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle luxury border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Stylized Luxury Dental Crown / Tooth Shape -->
  <!-- Main tooth body -->
  <path d="M168 112
           C116 112 84 160 84 220
           C84 288 116 328 138 380
           C160 432 176 448 208 448
           C236 448 244 384 256 384
           C268 384 276 448 304 448
           C336 448 352 432 374 380
           C396 328 428 288 428 220
           C428 160 396 112 344 112
           C292 112 272 152 256 152
           C240 152 220 112 168 112 Z"
        fill="url(#goldGrad)" />

  <!-- Inner accent curve to give 3D luxury dimension -->
  <path d="M256 196
           C266 196 278 174 316 174
           C348 174 368 202 368 240
           C368 284 346 312 328 352
           C314 384 304 394 286 394
           C274 394 266 364 256 364
           C246 364 238 394 226 394
           C208 394 198 384 184 352
           C166 312 144 284 144 240
           C144 202 164 174 196 174
           C234 174 246 196 256 196 Z"
        fill="#0E1524" opacity="0.9" />

  <!-- Lumière Radiant Dental Sparkle / Diamond Star -->
  <path d="M372 88
           C372 118 384 130 414 130
           C384 130 372 142 372 172
           C372 142 360 130 330 130
           C360 130 372 118 372 88 Z"
        fill="#FFFFFF" />
  <circle cx="372" cy="130" r="4" fill="#FFF2CE" />

  <!-- Micro sparkle -->
  <path d="M120 180
           C120 196 126 202 142 202
           C126 202 120 208 120 224
           C120 208 114 202 98 202
           C114 202 120 196 120 180 Z"
        fill="url(#goldGrad)" />
</svg>